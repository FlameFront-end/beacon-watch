services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - beaconwatch-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # Vulnerability timestamps are stored and compared as UTC instants. Pinning the container
      # clock to UTC keeps log output and any local-time formatting consistent with that.
      TZ: UTC
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_FROM: ${SMTP_FROM:-beaconwatch@beaconwatch.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SMTP_SETTINGS_ENCRYPTION_KEY: ${SMTP_SETTINGS_ENCRYPTION_KEY:?SMTP_SETTINGS_ENCRYPTION_KEY is required}
      SMTP_SOCKS5_HOST: ${SMTP_SOCKS5_HOST:-}
      SMTP_SOCKS5_PORT: ${SMTP_SOCKS5_PORT:-1080}
      SMTP_SOCKS5_USER: ${SMTP_SOCKS5_USER:-}
      SMTP_SOCKS5_PASSWORD: ${SMTP_SOCKS5_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      VULN_MONITORING_ENABLED: ${VULN_MONITORING_ENABLED:-false}
      VULN_NVD_ENABLED: ${VULN_NVD_ENABLED:-true}
      VULN_GITHUB_ENABLED: ${VULN_GITHUB_ENABLED:-true}
      VULN_CISA_KEV_ENABLED: ${VULN_CISA_KEV_ENABLED:-true}
      VULN_NVD_API_KEY: ${VULN_NVD_API_KEY:-}
      VULN_GITHUB_TOKEN: ${VULN_GITHUB_TOKEN:-}
      VULN_NVD_CRON: ${VULN_NVD_CRON:-*/15 * * * *}
      VULN_GITHUB_CRON: ${VULN_GITHUB_CRON:-*/10 * * * *}
      VULN_CISA_KEV_CRON: ${VULN_CISA_KEV_CRON:-0 * * * *}
      VULN_EXPLOIT_ENRICHMENT_ENABLED: ${VULN_EXPLOIT_ENRICHMENT_ENABLED:-true}
      VULN_EXPLOIT_ENRICHMENT_CRON: ${VULN_EXPLOIT_ENRICHMENT_CRON:-*/30 * * * *}
      VULN_EXPLOIT_GITHUB_BATCH_SIZE: ${VULN_EXPLOIT_GITHUB_BATCH_SIZE:-10}
      VULN_EXPLOIT_GITHUB_RESULT_LIMIT: ${VULN_EXPLOIT_GITHUB_RESULT_LIMIT:-10}
      VULN_EXPLOIT_LOOKUP_COOLDOWN_HOURS: ${VULN_EXPLOIT_LOOKUP_COOLDOWN_HOURS:-24}
      VULN_EXPLOIT_CANDIDATE_LIMIT: ${VULN_EXPLOIT_CANDIDATE_LIMIT:-500}
      VULN_EXPLOIT_DB_URL: ${VULN_EXPLOIT_DB_URL:-https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv}
      VULN_NVD_MAX_PAGES: ${VULN_NVD_MAX_PAGES:-15}
      VULN_GITHUB_MAX_PAGES: ${VULN_GITHUB_MAX_PAGES:-}
      VULN_CISA_KEV_MAX_PAGES: ${VULN_CISA_KEV_MAX_PAGES:-1}
      VULN_RENORMALIZATION_BATCH_SIZE: ${VULN_RENORMALIZATION_BATCH_SIZE:-200}
      VULN_SOURCE_TIMEOUT_MS: ${VULN_SOURCE_TIMEOUT_MS:-15000}
      VULN_NVD_TIMEOUT_MS: ${VULN_NVD_TIMEOUT_MS:-60000}
      VULN_SOURCE_MAX_RETRIES: ${VULN_SOURCE_MAX_RETRIES:-3}
      VULN_DEFAULT_MIN_SCORE: ${VULN_DEFAULT_MIN_SCORE:-60}
      VULN_NOTIFICATION_MIN_SCORE: ${VULN_NOTIFICATION_MIN_SCORE:-70}
      VULN_MAX_CVE_AGE_DAYS: ${VULN_MAX_CVE_AGE_DAYS:-30}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  beaconwatch-postgres:
