services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beaconwatch
      POSTGRES_PASSWORD: beaconwatch
      POSTGRES_DB: beaconwatch
    ports:
      - "5432:5432"
    volumes:
      - beaconwatch-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: beaconwatch
      DB_PASS: beaconwatch
      DB_NAME: beaconwatch
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  beaconwatch-postgres:
